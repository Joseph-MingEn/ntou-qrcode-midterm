<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>連線紀錄 | QR Code</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang TC",sans-serif;color:#163d38;background:#f3f7f3;font-synthesis:none}*{box-sizing:border-box}body{margin:0}main{max-width:1120px;margin:auto;padding:52px 28px 80px}.top{display:flex;justify-content:space-between;align-items:end;gap:20px;margin-bottom:28px}.eyebrow{color:#367567;font-weight:700;letter-spacing:.1em;font-size:.77rem}.top h1{font-size:clamp(2rem,4vw,2.9rem);letter-spacing:-.04em;margin:.45rem 0}.top p{color:#55716a;margin:0;line-height:1.6}.badge{border:1px solid #cbded4;background:#fff;border-radius:999px;padding:8px 13px;font-size:.82rem;white-space:nowrap}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-bottom:20px}.card,.panel{background:#fff;border:1px solid #dce9e1;border-radius:16px;box-shadow:0 8px 25px #193d3010}.card{padding:22px 24px}.card h2{font-size:.85rem;color:#58766c;margin:0 0 9px;font-weight:600}.card strong{font-size:2.15rem;line-height:1;font-variant-numeric:tabular-nums}.card p{margin:11px 0 0;font-size:.83rem;color:#6d817b}.panel{overflow:hidden}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:22px 24px;border-bottom:1px solid #e8f0eb}.toolbar h2{font-size:1.15rem;margin:0 0 4px}.toolbar p{margin:0;font-size:.82rem;color:#607d73}.actions{display:flex;gap:10px;align-items:center}select,button{font:inherit;border-radius:9px;padding:10px 13px;border:1px solid #cddfd5;background:white;color:#234c40}button{background:#176b57;color:white;border-color:#176b57;font-weight:600;cursor:pointer}button:hover{background:#115541}button:focus-visible,select:focus-visible{outline:3px solid #dda43a;outline-offset:2px}.notice{padding:16px 24px;font-size:.86rem;line-height:1.6;color:#506e64;background:#f9fcfa;border-bottom:1px solid #e8f0eb}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;text-align:left;min-width:820px}th,td{padding:15px 18px;border-bottom:1px solid #edf3ef;font-size:.83rem;vertical-align:top}th{font-weight:600;color:#607d73;font-size:.75rem;background:#fbfdfb}td{color:#294d43;line-height:1.5}td:nth-child(4){min-width:240px;max-width:400px;overflow-wrap:anywhere}.status{font-variant-numeric:tabular-nums}.empty{text-align:center;color:#6a837a;padding:45px 20px}.foot{font-size:.8rem;color:#6e847c;margin:18px 2px 0;line-height:1.6}@media(max-width:650px){main{padding:30px 16px 60px}.top{align-items:start;flex-direction:column}.cards{gap:10px}.card{padding:18px 16px}.card strong{font-size:1.8rem}.toolbar{align-items:start;flex-direction:column;padding:20px 16px}.actions{width:100%}.actions select{flex:1}.notice{padding:14px 16px}}

.range{padding:20px 24px;border-bottom:1px solid #e8f0eb;background:#fbfdfb}.range h2{margin:0 0 4px;font-size:1rem}.range p{margin:0;color:#607d73;font-size:.82rem;line-height:1.5}.range-fields{display:flex;align-items:end;gap:12px;flex-wrap:wrap;margin-top:14px}.range-field{flex:1 1 210px;min-width:0}.range-field label{display:block;font-size:.8rem;font-weight:600;color:#47685d;margin-bottom:7px}.range-field input{width:100%;min-width:0;border:1px solid #cddfd5;border-radius:9px;background:white;padding:9px 10px;font:inherit;color:#234c40}.range-field input:focus-visible{outline:3px solid #dda43a;outline-offset:2px}.range-buttons{display:flex;gap:8px}.range-buttons .secondary{background:white;color:#234c40;border-color:#cddfd5}.range-buttons .secondary:hover{background:#edf5f0}.range #period{margin-top:12px;color:#315e50}.range #range-error{color:#a63829;min-height:0}.range #range-error:not(:empty){margin-top:9px}@media(max-width:650px){.range{padding:18px 16px}.range-field{flex-basis:100%}.range-buttons{width:100%}.range-buttons button{flex:1}}
</style>
</head>
<body>
<main>
  <header class="top"><div><div class="eyebrow">QR CODE · 本機管理</div><h1>連線紀錄</h1><p>查看本機網站收到的請求與歷史紀錄。</p></div><span class="badge">● 僅限此電腦存取</span></header>
  <section class="cards" aria-label="連線摘要"><div class="card"><h2>網站請求</h2><strong id="total">—</strong><p>包含圖示等網站資源請求</p></div><div class="card"><h2>首頁載入</h2><strong id="home">—</strong><p>GET /，包含重整與預覽</p></div></section>
  <section class="panel" aria-labelledby="history-title">
  <form id="range-form" class="range" novalidate><h2>挑選時段</h2><p>以這台電腦的時區查詢；結束時間包含所選分鐘。</p><div class="range-fields"><div class="range-field"><label for="start">開始時間</label><input id="start" type="datetime-local" step="60"></div><div class="range-field"><label for="end">結束時間</label><input id="end" type="datetime-local" step="60"></div><div class="range-buttons"><button type="submit">套用時段</button><button id="clear-range" class="secondary" type="button">清除時段</button></div></div><p id="period">目前：全部時間</p><p id="range-error" role="alert"></p></form>
  <div class="toolbar"><div><h2 id="history-title">最近紀錄</h2><p>依時間由新到舊顯示，最多 1,000 筆</p></div><div class="actions"><label for="filter" class="visually-hidden">顯示類型</label><select id="filter"><option value="all">全部網站請求</option><option value="home">僅首頁載入</option></select><button id="refresh" type="button">重新整理</button></div></div>
  <div class="notice" id="status" role="status" aria-live="polite">讀取中…</div>
  <div class="table-wrap"><table><thead><tr><th>時間</th><th>來源 IP</th><th>請求與狀態</th><th>瀏覽器 User-Agent</th><th>紀錄檔</th></tr></thead><tbody id="rows"></tbody></table></div></section>
  <p class="foot">網站請求與首頁載入都不等於掃描次數或裝置數。直接輸入網址、重整或預覽也會產生請求。後台資料不自動上傳。</p>
</main>
<style>.visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style>
<script>
const total=document.querySelector('#total'), home=document.querySelector('#home'), rows=document.querySelector('#rows'), status=document.querySelector('#status'), filter=document.querySelector('#filter');
const startInput=document.querySelector('#start'), endInput=document.querySelector('#end'), period=document.querySelector('#period'), rangeError=document.querySelector('#range-error');
let data=null, activeParams=new URLSearchParams(), requestId=0;
function dateLabel(value){return value.replace('T',' ');}
function applyRange(){
 const start=startInput.value, end=endInput.value;
 const startTime=start?new Date(start).getTime():null, endTime=end?new Date(end).getTime():null;
 if((start&&Number.isNaN(startTime))||(end&&Number.isNaN(endTime))){rangeError.textContent='請輸入有效的開始及結束時間。';return;}
 if(startTime!==null&&endTime!==null&&startTime>endTime){rangeError.textContent='結束時間不可早於開始時間。';return;}
 const params=new URLSearchParams();
 try{if(startTime!==null)params.set('start',new Date(startTime).toISOString());if(endTime!==null)params.set('end',new Date(endTime+60000).toISOString());}
 catch{rangeError.textContent='時間超出可查詢範圍。';return;}
 activeParams=params;rangeError.textContent='';
 period.textContent=start||end?`目前：${start?dateLabel(start):'不限開始'} 至 ${end?dateLabel(end)+'（含該分鐘）':'不限結束'}；使用此電腦時區`:'目前：全部時間';
 refresh();
}

function cell(row,text){const td=document.createElement('td');td.textContent=String(text);row.appendChild(td);}
function render(){
 rows.replaceChildren();
 const visible=data.records.filter(r=>filter.value==='all'||(r.method==='GET'&&r.path==='/'));
 if(!visible.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=5;td.className='empty';td.textContent='目前沒有符合條件的紀錄。';tr.appendChild(td);rows.appendChild(tr);return;}
 for(const item of visible){const tr=document.createElement('tr');cell(tr,item.time);cell(tr,item.ip);cell(tr,`${item.method} ${item.path} · ${item.status}`);cell(tr,item.user_agent||'未提供');cell(tr,item.source);rows.appendChild(tr);}
}
async function refresh(){
 const current=++requestId;status.textContent='讀取中…';
 try{
  const query=activeParams.toString();const response=await fetch('/api/visits'+(query?'?'+query:''),{cache:'no-store'});if(!response.ok)throw new Error(`HTTP ${response.status}`);
  const result=await response.json();if(current!==requestId)return;data=result;total.textContent=data.site_requests;home.textContent=data.home_requests;render();
  const details=[];if(data.truncated)details.push('僅顯示最新 1,000 筆');if(data.invalid_records)details.push(`略過 ${data.invalid_records} 筆格式不正確的紀錄`);if(data.unreadable_files)details.push(`${data.unreadable_files} 個檔案無法讀取`);
  status.textContent=`已載入 ${data.records.length} 筆紀錄。${details.length?' '+details.join('；')+'。':''} 每筆代表 HTTP 請求，不代表一次掃描。`;
 }catch(error){if(current!==requestId)return;data=null;rows.replaceChildren();total.textContent='—';home.textContent='—';status.textContent=`無法讀取紀錄：${error.message}。請確認服務仍在執行，然後重新整理。`;}
}
document.querySelector('#range-form').addEventListener('submit',event=>{event.preventDefault();applyRange();});
document.querySelector('#clear-range').addEventListener('click',()=>{startInput.value='';endInput.value='';applyRange();});
filter.addEventListener('change',()=>{if(data)render();});document.querySelector('#refresh').addEventListener('click',refresh);refresh();
</script>
</body>
</html>
